# Generated by the Runebase Discord bot's npm run guide:publish: don't edit.
# Builds every version of the guide with MkDocs Material and mike onto the
# gh-pages branch (a folder each) and deploys it to GitHub Pages
# (Settings → Pages → Source: GitHub Actions). "next" is the guide to the
# coming update (main); a tag vX.Y.Z is that release's guide, built once (on
# the push to main that comes with it).
name: Publish the guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Build every version onto gh-pages
        run: |
          deployed=$(mike list --json 2>/dev/null | jq -r '.[].version' || true)
          for tag in $(git tag --list 'v*' --sort=v:refname); do
            grep -qxF "${tag#v}" <<<"$deployed" && continue
            git checkout -q "$tag"
            pip install -q -r requirements.txt
            mike deploy --push --title "$tag" "${tag#v}"
          done
          newest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$newest" ]; then
            mike alias --push --update-aliases "${newest#v}" latest
            mike set-default --push latest
          fi
          git checkout -q origin/main
          pip install -q -r requirements.txt
          mike deploy --push --title 'Next update' next
          [ -n "$newest" ] || mike set-default --push next
          rm -rf _site && mkdir _site && git archive gh-pages | tar -x -C _site
          cp site-root/404.html _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
