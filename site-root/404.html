<!doctype html>
<!-- Generated by npm run guide:publish (the Runebase Discord bot): don't edit. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runebase World Guide</title>
<style>body { font-family: system-ui, sans-serif; margin: 3rem 1rem; text-align: center; }</style>
<script>
(async () => {
  const root = "/runebase-world-guide/";
  const rest = location.pathname.startsWith(root) ? location.pathname.slice(root.length) : '';
  try {
    const versions = await (await fetch(root + 'versions.json')).json();
    const names = new Set(versions.flatMap((v) => [v.version, ...v.aliases]));
    if (rest && !names.has(rest.split('/')[0])) {
      const version = names.has("latest") ? "latest" : "next";
      location.replace(root + version + '/' + rest + location.search + location.hash);
      return;
    }
  } catch (err) {
    // No version list: say the page isn't there.
  }
  document.getElementById('missing').hidden = false;
})();
</script>
</head>
<body>
<p id="missing" hidden>This page isn't in the guide. <a href="/runebase-world-guide/">Go to the Runebase World Guide</a>.</p>
</body>
</html>
